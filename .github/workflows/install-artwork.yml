name: Install Monarch artwork

on:
  push:
    branches: [main]
    paths:
      - ".art-upload/READY"

permissions:
  contents: write

jobs:
  install-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download full-resolution source artwork into the repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/art
          curl -fL --retry 3 -o assets/art/26.3.jpg "https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/key-art/Minecraft_WildernessBound.Net_1170x500.jpg"
          curl -fL --retry 3 -o assets/art/26.2.jpg "https://www.minecraft.net/content/dam/minecraftnet/games/minecraft/screenshots/MCV_SummerDropKeyArt_NetBlogEditorial_1170x500.jpg"
          test "$(wc -c < assets/art/26.3.jpg)" -gt 50000
          test "$(wc -c < assets/art/26.2.jpg)" -gt 50000
          file assets/art/26.3.jpg
          file assets/art/26.2.jpg

      - name: Commit local JPEG artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Monarch Artwork Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/art/26.2.jpg assets/art/26.3.jpg
          git commit -m "Replace compressed artwork with full-resolution JPEGs"
          git push
