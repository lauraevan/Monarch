<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="Monarch - a browser Minecraft launcher.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Monarch</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="#home" aria-label="Monarch home">
          <span class="brand-name">MONARCH</span>
          <span class="brand-subtitle">LAUNCHER</span>
        </a>
      </div>

      <nav class="nav" aria-label="Launcher sections">
        <div class="nav-label">Library</div>
        <button class="nav-item active" data-view="home"><span>Home</span></button>
        <button class="nav-item" data-view="all"><span>All builds</span><span class="nav-count" id="allCount">0</span></button>

        <div class="nav-label nav-label-spaced">Versions</div>
        <button class="nav-item" data-view="vanilla"><span>Regular</span></button>
        <button class="nav-item" data-view="client"><span>Clients</span></button>
        <button class="nav-item" data-view="modded"><span>Modded</span></button>
        <button class="nav-item" data-view="fps"><span>FPS clients</span></button>
        <button class="nav-item" data-view="snapshot"><span>Snapshots</span></button>

        <div class="nav-label nav-label-spaced">My library</div>
        <button class="nav-item" data-view="favorites"><span>Favorites</span><span class="nav-count" id="favoriteCount">0</span></button>
        <button class="nav-item" data-view="recent"><span>Recently played</span></button>
      </nav>

      <div class="sidebar-footer">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Monarch ready</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">
          <span></span><span></span><span></span>
        </button>

        <div class="topbar-title">
          <strong>Game Library</strong>
          <span>Choose a build and play</span>
        </div>

        <label class="search-wrap" aria-label="Search Monarch">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65A8 8 0 1 1 3 11a8 8 0 0 1 16 0Z"/></svg>
          <input id="searchInput" type="search" autocomplete="off" placeholder="Search builds">
        </label>
      </header>

      <section class="content" id="content">
        <section class="hero" id="hero">
          <div class="hero-shade" aria-hidden="true"></div>

          <div class="hero-copy">
            <div class="eyebrow" id="heroEyebrow">FEATURED BUILD</div>
            <h1 id="heroTitle">Monarch</h1>
            <p id="heroDescription">Every build. One launcher.</p>
            <div class="hero-meta" id="heroMeta"></div>
          </div>

          <div class="hero-launchbar">
            <div class="hero-selection">
              <span class="selection-label">Selected build</span>
              <strong id="heroSelectionName">Monarch</strong>
            </div>
            <div class="hero-actions">
              <button class="secondary-button" id="heroDetails">View details</button>
              <button class="primary-button" id="heroLaunch">Play</button>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="section-heading">
            <div>
              <div class="eyebrow" id="viewEyebrow">MONARCH LIBRARY</div>
              <h2 id="viewTitle">Featured builds</h2>
            </div>
            <div class="result-count" id="resultCount"></div>
          </div>

          <div class="build-grid" id="buildGrid" aria-live="polite"></div>

          <div class="empty-state hidden" id="emptyState">
            <h3>No builds found</h3>
            <p>Try another search or category.</p>
          </div>
        </section>
      </section>
    </main>
  </div>

  <dialog class="details-dialog" id="detailsDialog">
    <button class="dialog-close" id="dialogClose" aria-label="Close">×</button>
    <div class="dialog-cover" id="dialogCover"></div>
    <div class="dialog-body">
      <div class="eyebrow" id="dialogEyebrow"></div>
      <h2 id="dialogTitle"></h2>
      <p id="dialogDescription"></p>
      <div class="detail-chips" id="dialogChips"></div>
      <div class="detail-facts" id="dialogFacts"></div>
      <div class="dialog-actions">
        <button class="primary-button" id="dialogLaunch">Play</button>
        <button class="secondary-button" id="dialogFavorite">Add favorite</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./assets/app.js" defer></script>
</body>
</html>
